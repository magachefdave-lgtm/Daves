<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EM 평가 현황</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--BODY-->
<div class="wrap">
  <header class="top">
    <h1>EM 평가 현황<small>WLR Ceramic PKG 본딩 EM</small></h1>
    <div class="meta"><span class="meta" id="meta"></span><label class="who" for="who">작업자 <input id="who" type="text" maxlength="30" autocomplete="name"></label><button class="btn" id="reload" type="button">새로 읽기</button></div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <div class="filters">
    <label for="f-process">공정 <select id="f-process"></select></label>
    <label for="f-tester">작업자 <select id="f-tester"></select></label>
    <label for="f-equip">설비 <select id="f-equip"></select></label>
    <label for="f-engineer">담당 <select id="f-engineer"></select></label>
    <label for="f-q">검색 <input id="f-q" type="search" autocomplete="off" title="SDM, List, Lot, Structure, Vehicle, 비고, 설비, 작업자"></label>
    <button class="btn" id="reset" type="button">조건 초기화</button>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="view" class="view"></main>
  <p class="foot" id="src"></p>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="modal" class="modal" hidden></div>
<!--/BODY-->
<script src="rules.js"></script>
<script src="app.js"></script>
</body>
</html>
