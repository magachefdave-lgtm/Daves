# 실제 VNC 서버를 띄워 놓고, 프로그램의 상태 확인이 서버를 막히게 하지 않는지 확인한다.
# (리눅스 설비에서 "Too many security failures" 가 났던 일을 다시 겪지 않기 위해)
#
# 각 서버마다: 정상 로그인 확인 → 프로그램과 같은 상태 확인(launcher.core.probe)을 여러 번 →
# 다시 진짜 VNC 로그인(비밀번호 인증까지)이 되는지 본다. 300번 = PC 30대가 10분 동안 확인한 양.
name: VNC server safety check

on:
  push:
    paths:
      - "vnc-launcher/**"
      - ".github/workflows/vnc-server-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-servers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vnc-launcher
    steps:
      - uses: actions/checkout@v4
      - name: Install VNC servers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tigervnc-standalone-server tigervnc-scraping-server x11vnc xvfb iputils-ping
          python3 -m pip install --quiet pycryptodome
      - name: Start TigerVNC (Xvnc, x0vncserver) and x11vnc
        run: |
          python3 tools/vnc_server_check.py --password ci-pw-01 --write-passwd "$RUNNER_TEMP/pw"
          chmod 600 "$RUNNER_TEMP/pw"
          Xtigervnc :1 -rfbport 5901 -PasswordFile "$RUNNER_TEMP/pw" -SecurityTypes VncAuth -geometry 800x600 > "$RUNNER_TEMP/xvnc.log" 2>&1 &
          Xvfb :2 -screen 0 800x600x24 > /dev/null 2>&1 &
          Xvfb :3 -screen 0 800x600x24 > /dev/null 2>&1 &
          sleep 2
          DISPLAY=:2 x0vncserver -rfbport 5902 -PasswordFile "$RUNNER_TEMP/pw" -SecurityTypes VncAuth > "$RUNNER_TEMP/x0vnc.log" 2>&1 &
          x11vnc -display :3 -rfbport 5903 -rfbauth "$RUNNER_TEMP/pw" -forever -shared -bg -o "$RUNNER_TEMP/x11vnc.log"
          echo "Xvnc $(Xtigervnc -version 2>&1 | head -1)" ; x11vnc -version 2>&1 | head -1
      - name: Status checks must not get this PC blocked
        run: |
          S="$GITHUB_STEP_SUMMARY"
          {
            echo "### 리눅스 VNC 서버"
            echo "| 서버 | 설비 OS / 확인 방식 | 확인 횟수 | 응답 | 그 뒤 로그인 | 내용 | 판정 |"
            echo "|---|---|---|---|---|---|---|"
          } >> "$S"
          rc=0
          for srv in "TigerVNC-Xvnc 5901" "TigerVNC-x0vncserver 5902" "x11vnc 5903"; do
            set -- $srv
            # 프로그램 기본값 (리눅스 설비 = ping): 300번 확인해도 막히면 안 된다
            python3 tools/vnc_server_check.py --label "$1" --port $2 --password ci-pw-01 --os Linux --check auto \
              --rounds 300 --expect ok --require-answer --summary "$S" || rc=1
          done
          # 리눅스 설비를 'VNC 포트'로 바꾸면 TigerVNC 가 막는다 - 프로그램이 이 경우 경고하는 근거.
          # 결과가 바뀌면(서버가 더 이상 막지 않으면) 여기서 알 수 있다.
          python3 tools/vnc_server_check.py --label "TigerVNC-Xvnc" --port 5901 --password ci-pw-01 --os Linux --check port \
            --rounds 8 --expect blocked --summary "$S" || rc=1
          python3 tools/vnc_server_check.py --label "x11vnc" --port 5903 --password ci-pw-01 --os Linux --check port \
            --rounds 300 --expect any --summary "$S" || rc=1
          exit $rc
      - name: Server logs
        if: always()
        run: tail -n 20 "$RUNNER_TEMP"/*.log || true

  windows-servers:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: vnc-launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pycryptodome
      # 루프백(127.0.0.1) 접속은 VNC 서버들이 기본으로 막으므로 이 PC 의 네트워크 주소로 접속한다
      - name: Find this PC's address
        run: |
          $ip = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -notlike '127.*' -and $_.IPAddress -notlike '169.254.*' } | Select-Object -First 1).IPAddress
          "HOST_IP=$ip" >> $env:GITHUB_ENV
          "### Windows VNC 서버 (주소 $ip)" >> $env:GITHUB_STEP_SUMMARY
          "| 서버 | 설비 OS / 확인 방식 | 확인 횟수 | 응답 | 그 뒤 로그인 | 내용 | 판정 |" >> $env:GITHUB_STEP_SUMMARY
          "|---|---|---|---|---|---|---|" >> $env:GITHUB_STEP_SUMMARY
      - name: UltraVNC server
        timeout-minutes: 10
        run: |
          # UltraVNC (Chocolatey 패키지 = 공식 설치 파일을 조용히 설치). 설치 기록을 그대로 남긴다.
          choco install ultravnc -y --no-progress --ignore-checksums 2>&1 | Write-Host
          # 프로그램이 방금 깐 UltraVNC 뷰어를 저절로 찾는지 (처음 설정·배포본에서 쓰는 것)
          python -c "from launcher.core import detect_viewer; f = detect_viewer(); print('뷰어 찾기:', f); assert f and f[0] == 'ultravnc', f"
          if ($LASTEXITCODE) { throw "UltraVNC 뷰어를 찾지 못함" }
          $rel = [pscustomobject]@{ tag_name = 'chocolatey' }
          $all = Get-ChildItem 'C:\Program Files\uvnc\UltraVNC', 'C:\Program Files\uvnc bvba\UltraVNC', 'C:\Program Files\UltraVNC' -Filter winvnc.exe -ErrorAction SilentlyContinue
          $exe = ($all | Where-Object { $_.FullName -match 'x64|64' } | Select-Object -First 1)
          if (-not $exe) { $exe = $all | Select-Object -First 1 }
          if (-not $exe) { throw "winvnc.exe 를 찾지 못함" }
          Write-Host "UltraVNC: $($exe.FullName) $($exe.VersionInfo.FileVersion)"
          "UltraVNC $($rel.tag_name) ($($exe.VersionInfo.FileVersion))" | Out-File -Append -Encoding utf8 $env:RUNNER_TEMP\versions.txt
          Get-Service uvnc_service -ErrorAction SilentlyContinue | Stop-Service -Force -ErrorAction SilentlyContinue
          $hex = python tools/vnc_server_check.py --password ci-pw-01 --print-hex
          $ini = @"
          [ultravnc]
          passwd=$hex
          passwd2=$hex
          [admin]
          UseRegistry=0
          SocketConnect=1
          AutoPortSelect=0
          PortNumber=5900
          HTTPConnect=0
          AuthRequired=1
          AllowLoopback=1
          LoopbackOnly=0
          MSLogonRequired=0
          NewMSLogon=0
          DisableTrayIcon=1
          QuerySetting=2
          QueryTimeout=1
          QueryAccept=1
          "@
          ($ini -split "`n" | ForEach-Object { $_.Trim() }) -join "`r`n" | Set-Content -Encoding ascii (Join-Path $exe.DirectoryName 'ultravnc.ini')
          Start-Process $exe.FullName -ArgumentList '-run'
          Start-Sleep -Seconds 8
          if (-not (Get-NetTCPConnection -LocalPort 5900 -State Listen -ErrorAction SilentlyContinue)) {
            Write-Host "프로그램으로는 안 떠서 서비스로 설치해 실행"
            Get-Process winvnc -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Process -Wait $exe.FullName -ArgumentList '-install'
            Start-Sleep -Seconds 3
            Start-Service uvnc_service -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 8
          }
          Get-NetTCPConnection -LocalPort 5900 -State Listen -ErrorAction SilentlyContinue | Format-Table -AutoSize | Out-String | Write-Host
          $rc = 0
          # 프로그램 기본값 (Windows 설비 = VNC 포트 확인)
          python tools/vnc_server_check.py --label UltraVNC --host $env:HOST_IP --port 5900 --password ci-pw-01 --os Windows --check auto --rounds 300 --expect ok --require-answer --wait 60 --summary $env:GITHUB_STEP_SUMMARY
          if ($LASTEXITCODE) { $rc = 1 }
          # 같은 설비를 ping 으로 확인할 때 (Windows 의 IcmpSendEcho 경로)
          python tools/vnc_server_check.py --label UltraVNC --host $env:HOST_IP --port 5900 --password ci-pw-01 --os Windows --check ping --rounds 50 --expect ok --require-answer --summary $env:GITHUB_STEP_SUMMARY
          if ($LASTEXITCODE) { $rc = 1 }
          Get-Service uvnc_service -ErrorAction SilentlyContinue | Stop-Service -Force -ErrorAction SilentlyContinue
          Get-Process winvnc -ErrorAction SilentlyContinue | Stop-Process -Force
          exit $rc
      - name: TightVNC server
        if: always()
        timeout-minutes: 10
        run: |
          choco install tightvnc -y --no-progress --install-arguments="'ADDLOCAL=Server SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=ci-pw-01 SET_RFBPORT=1 VALUE_OF_RFBPORT=5901 SET_ALLOWLOOPBACK=1 VALUE_OF_ALLOWLOOPBACK=1'" | Select-Object -Last 8
          Restart-Service tvnserver -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5
          Get-NetTCPConnection -LocalPort 5901 -State Listen -ErrorAction SilentlyContinue | Format-Table -AutoSize | Out-String | Write-Host
          python tools/vnc_server_check.py --label TightVNC --host $env:HOST_IP --port 5901 --password ci-pw-01 --os Windows --check auto --rounds 300 --expect ok --require-answer --wait 60 --summary $env:GITHUB_STEP_SUMMARY
          exit $LASTEXITCODE
