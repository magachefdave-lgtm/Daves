name: Build equipment remote launcher (Windows exe)

on:
  push:
    paths:
      - "vnc-launcher/**"
      - ".github/workflows/build-vnc-launcher.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: vnc-launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install pyinstaller pytest
      - name: Test
        run: python -m pytest -q tests
      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --noconsole
          --name EquipmentRemote
          --exclude-module pytest --exclude-module _pytest --exclude-module pluggy
          equipment_remote.py
      - name: Add user documents
        run: Copy-Item *.txt, *.csv dist/
      - uses: actions/upload-artifact@v4
        with:
          name: EquipmentRemote
          path: vnc-launcher/dist/
          if-no-files-found: error
      # Commit message containing [publish-zip] also stores the build in the branch,
      # for places that cannot reach the Actions artifact storage.
      - name: Publish zip to branch
        if: contains(github.event.head_commit.message, '[publish-zip]')
        shell: bash
        working-directory: .
        run: |
          mkdir -p release
          python -c "import zipfile,os; d='vnc-launcher/dist'; z=zipfile.ZipFile('release/EquipmentRemote.zip','w',zipfile.ZIP_DEFLATED); [z.write(os.path.join(d,f),'EquipmentRemote/'+f) for f in sorted(os.listdir(d))]; z.close()"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/EquipmentRemote.zip
          git commit -m "Add built EquipmentRemote.zip"
          git push
