name: Build equipment remote launcher (Windows exe)

on:
  push:
    paths:
      - "vnc-launcher/**"
      - ".github/workflows/build-vnc-launcher.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: vnc-launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install pyinstaller pytest
      - name: Test
        run: python -m pytest -q tests
      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --noconsole
          --name EquipmentRemote --icon assets/app.ico
          --add-data "시작하기.txt;." --add-data "설비목록_예시.csv;." --add-data "비밀번호_예시.csv;."
          --exclude-module pytest --exclude-module _pytest --exclude-module pluggy
          equipment_remote.py
      # 배포본(exe 끝에 설정을 붙인 것)이 Windows 에서도 그대로 실행되는지 실제로 돌려 본다
      - name: Check a deploy package runs on Windows
        timeout-minutes: 5
        run: |
          python -c "from launcher.pack import make_payload, write_pack; write_pack('dist/EquipmentRemote.exe', 'packcheck.exe', make_payload({'viewer_type': 'ultravnc'}, {'groups': [], 'items': [{'name': 'A', 'host': '10.0.0.1'}]}, {'x': 'pw'}, 'abc'))"
          Start-Process -Wait -FilePath .\packcheck.exe -ArgumentList '--pack-info','packinfo.json'
          Start-Process -Wait -FilePath .\dist\EquipmentRemote.exe -ArgumentList '--pack-info','plaininfo.json'
          python -c "import json; p=json.load(open('packinfo.json',encoding='utf-8'))['pack']; n=json.load(open('plaininfo.json',encoding='utf-8'))['pack']; assert p and p['items']==1 and p['password_count']==1, p; assert n is None, n; print('deploy package ok', p)"
          Remove-Item packcheck.exe, packinfo.json, plaininfo.json
      # 업데이트: 실행 중인 exe 가 자기 이름을 바꾸고 새 exe 를 놓은 뒤, 새 exe 를 다시 켜는지 실제로 돌려 본다
      - name: Check self-update works on Windows
        timeout-minutes: 5
        run: |
          New-Item -ItemType Directory -Force updtest\app | Out-Null
          Copy-Item dist\EquipmentRemote.exe updtest\app\EquipmentRemote.exe
          python -c "from launcher.update import publish; publish('dist/EquipmentRemote.exe', 'updtest/server', '99.0.0', 'ci')"
          $u = (Resolve-Path updtest).Path
          Start-Process -Wait -FilePath "$u\app\EquipmentRemote.exe" -ArgumentList '--install-update',"$u\server",'--result',"$u\result.json"
          for ($i = 0; $i -lt 90 -and -not (Test-Path "$u\result.json.relaunched")); $i++) { Start-Sleep -Seconds 1 }
          python -c "import json; r=json.load(open('updtest/result.json')); assert r['old_exists'], r; v=open('updtest/result.json.relaunched').read(); assert v, v; print('self-update ok', r, 'relaunched', v)"
          Start-Sleep -Seconds 3
          Remove-Item -Recurse -Force updtest
      - uses: actions/upload-artifact@v4
        with:
          name: EquipmentRemote
          path: vnc-launcher/dist/
          if-no-files-found: error
      # Commit message containing [publish-zip] also stores the build in the branch,
      # for places that cannot reach the Actions artifact storage. It is a single exe:
      # the user guide and CSV templates are inside it.
      - name: Publish exe to branch
        if: contains(github.event.head_commit.message, '[publish-zip]')
        shell: bash
        working-directory: .
        run: |
          git rm -q --ignore-unmatch release/EquipmentRemote.zip
          mkdir -p release   # 위에서 zip 을 지우면 빈 release 폴더도 사라지므로 그 뒤에 만든다
          cp vnc-launcher/dist/EquipmentRemote.exe release/EquipmentRemote.exe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/EquipmentRemote.exe
          git commit -m "Add built EquipmentRemote.exe"
          git push
