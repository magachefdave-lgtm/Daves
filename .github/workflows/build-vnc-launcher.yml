name: Build equipment remote launcher (Windows exe)

on:
  push:
    paths:
      - "vnc-launcher/**"
      - ".github/workflows/build-vnc-launcher.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: vnc-launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install pyinstaller pytest
      - name: Test
        run: python -m pytest -q tests
      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --noconsole
          --name EquipmentRemote --icon assets/app.ico
          --add-data "시작하기.txt;." --add-data "설비목록_예시.csv;." --add-data "비밀번호_예시.csv;."
          --exclude-module pytest --exclude-module _pytest --exclude-module pluggy
          equipment_remote.py
      - uses: actions/upload-artifact@v4
        with:
          name: EquipmentRemote
          path: vnc-launcher/dist/
          if-no-files-found: error
      # Commit message containing [publish-zip] also stores the build in the branch,
      # for places that cannot reach the Actions artifact storage. It is a single exe:
      # the user guide and CSV templates are inside it.
      - name: Publish exe to branch
        if: contains(github.event.head_commit.message, '[publish-zip]')
        shell: bash
        working-directory: .
        run: |
          git rm -q --ignore-unmatch release/EquipmentRemote.zip
          mkdir -p release   # 위에서 zip 을 지우면 빈 release 폴더도 사라지므로 그 뒤에 만든다
          cp vnc-launcher/dist/EquipmentRemote.exe release/EquipmentRemote.exe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/EquipmentRemote.exe
          git commit -m "Add built EquipmentRemote.exe"
          git push
